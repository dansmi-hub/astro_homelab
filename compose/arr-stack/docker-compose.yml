name: arr-stack

services:
  # ============================================================================
  # VPN Gateway & Torrent Client
  # ============================================================================
  vpn:
    image: binhex/arch-qbittorrentvpn:latest
    container_name: binhex-qbittorrentvpn
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - "8080:8080"   # qBittorrent Web UI
      - "8989:8989"   # Sonarr
      - "7878:7878"   # Radarr
      - "9696:9696"   # Prowlarr
      - "6767:6767"   # Bazarr
      - "8787:8787"   # Readarr
      - "8191:8191"   # FlareSolverr
      - "6868:6868"   # Profilarr
      - "5010:5010"   # Mousehole
      - "6881:6881"   # qBittorrent peer port (TCP)
      - "6881:6881/udp" # qBittorrent peer port (UDP)
    environment:
      PUID: "${PUID:-99}"
      PGID: "${PGID:-100}"
      TZ: "${TZ:-America/New_York}"
      VPN_ENABLED: "true"
      VPN_USER: "${VPN_USER}"
      VPN_PASS: "${VPN_PASS}"
      VPN_PROV: "${VPN_PROV:-custom}"
      VPN_CLIENT: "${VPN_CLIENT:-openvpn}"
      LAN_NETWORK: "${LAN_NETWORK:-192.168.1.0/24}"
      NAME_SERVERS: "${NAME_SERVERS:-1.1.1.1,1.0.0.1}"
      STRICT_PORT_FORWARD: "yes"
      WEBUI_PORT: "8080"
    volumes:
      - /mnt/user/appdata/binhex-qbittorrentvpn:/config
      - /mnt/user/data:/data
    networks:
      - homelab-net
    labels:
      net.unraid.docker.icon: "https://raw.githubusercontent.com/binhex/docker-templates/master/binhex/images/qbittorrent-icon.png"
      net.unraid.docker.webui: "http://[IP]:[PORT:8080]"

  # ============================================================================
  # Core Arr Applications (VPN Networked)
  # ============================================================================
  sonarr:
    image: binhex/arch-sonarr:latest
    container_name: binhex-sonarr
    restart: unless-stopped
    network_mode: "service:vpn"
    depends_on:
      vpn:
        condition: service_started
    environment:
      PUID: "${PUID:-99}"
      PGID: "${PGID:-100}"
      TZ: "${TZ:-America/New_York}"
    volumes:
      - /mnt/user/appdata/binhex-sonarr:/config
      - /mnt/user/data:/data
    labels:
      net.unraid.docker.icon: "https://raw.githubusercontent.com/binhex/docker-templates/master/binhex/images/sonarr-icon.png"
      net.unraid.docker.webui: "http://[IP]:8989"

  radarr:
    image: binhex/arch-radarr:latest
    container_name: binhex-radarr
    restart: unless-stopped
    network_mode: "service:vpn"
    depends_on:
      vpn:
        condition: service_started
    environment:
      PUID: "${PUID:-99}"
      PGID: "${PGID:-100}"
      TZ: "${TZ:-America/New_York}"
    volumes:
      - /mnt/user/appdata/binhex-radarr:/config
      - /mnt/user/data:/data
    labels:
      net.unraid.docker.icon: "https://raw.githubusercontent.com/binhex/docker-templates/master/binhex/images/radarr-icon.png"
      net.unraid.docker.webui: "http://[IP]:7878"

  prowlarr:
    image: binhex/arch-prowlarr:latest
    container_name: binhex-prowlarr
    restart: unless-stopped
    network_mode: "service:vpn"
    depends_on:
      vpn:
        condition: service_started
    environment:
      PUID: "${PUID:-99}"
      PGID: "${PGID:-100}"
      TZ: "${TZ:-America/New_York}"
    volumes:
      - /mnt/user/appdata/binhex-prowlarr:/config
      - /mnt/user/data:/data
    labels:
      net.unraid.docker.icon: "https://raw.githubusercontent.com/binhex/docker-templates/master/binhex/images/prowlarr-icon.png"
      net.unraid.docker.webui: "http://[IP]:9696"

  # ============================================================================
  # Accessory Services (VPN Networked)
  # ============================================================================
  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    restart: unless-stopped
    network_mode: "service:vpn"
    depends_on:
      vpn:
        condition: service_started
    environment:
      PUID: "${PUID:-99}"
      PGID: "${PGID:-100}"
      TZ: "${TZ:-America/New_York}"
    volumes:
      - /mnt/user/appdata/bazarr:/config
      - /mnt/user/data:/data
    labels:
      net.unraid.docker.icon: "https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/bazarr-icon.png"
      net.unraid.docker.webui: "http://[IP]:6767"

  readarr:
    image: binhex/arch-readarr:latest
    container_name: binhex-readarr
    restart: unless-stopped
    network_mode: "service:vpn"
    depends_on:
      vpn:
        condition: service_started
    environment:
      PUID: "${PUID:-99}"
      PGID: "${PGID:-100}"
      TZ: "${TZ:-America/New_York}"
    volumes:
      - /mnt/user/appdata/readarr:/config
      - /mnt/user/data:/data
    labels:
      net.unraid.docker.icon: "https://raw.githubusercontent.com/binhex/docker-templates/master/binhex/images/readarr-icon.png"
      net.unraid.docker.webui: "http://[IP]:8787"

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    restart: unless-stopped
    network_mode: "service:vpn"
    depends_on:
      vpn:
        condition: service_started
    environment:
      TZ: "${TZ:-America/New_York}"
      LOG_LEVEL: "info"
    labels:
      net.unraid.docker.icon: "https://raw.githubusercontent.com/FlareSolverr/FlareSolverr/master/src/resources/icon.png"
      net.unraid.docker.webui: "http://[IP]:8191"

  profilarr:
    image: ghcr.io/m3ngler/profilarr:latest
    container_name: profilarr
    restart: unless-stopped
    network_mode: "service:vpn"
    depends_on:
      vpn:
        condition: service_started
    environment:
      PUID: "${PUID:-99}"
      PGID: "${PGID:-100}"
      TZ: "${TZ:-America/New_York}"
    volumes:
      - /mnt/user/appdata/profilarr:/config
    labels:
      net.unraid.docker.icon: "https://raw.githubusercontent.com/m3ngler/profilarr/main/docs/logo.png"
      net.unraid.docker.webui: "http://[IP]:6868"

  mousehole:
    image: ghcr.io/th3-s1lenc3r/mousehole:latest
    container_name: mousehole
    restart: unless-stopped
    network_mode: "service:vpn"
    depends_on:
      vpn:
        condition: service_started
    environment:
      PUID: "${PUID:-99}"
      PGID: "${PGID:-100}"
      TZ: "${TZ:-America/New_York}"
    volumes:
      - /mnt/user/appdata/mousehole:/var/lib/mousehole
    labels:
      net.unraid.docker.icon: "https://raw.githubusercontent.com/th3-s1lenc3r/mousehole/main/icon.png"
      net.unraid.docker.webui: "http://[IP]:5010"

  # ============================================================================
  # Auxiliary Extract Service (Standard Bridge / Homelab Network)
  # ============================================================================
  unpackerr:
    image: golift/unpackerr:latest
    container_name: unpackerr
    restart: unless-stopped
    networks:
      - homelab-net
    environment:
      PUID: "${PUID:-99}"
      PGID: "${PGID:-100}"
      TZ: "${TZ:-America/New_York}"
      UN_SONARR_0_URL: "http://192.168.1.219:8989"
      UN_SONARR_0_API_KEY: "${SONARR_API_KEY}"
      UN_RADARR_0_URL: "http://192.168.1.219:7878"
      UN_RADARR_0_API_KEY: "${RADARR_API_KEY}"
    volumes:
      - /mnt/user/appdata/unpackerr:/config
      - /mnt/user/data:/data
    labels:
      net.unraid.docker.icon: "https://raw.githubusercontent.com/unraid/docker-templates/master/images/unpackerr-icon.png"

networks:
  homelab-net:
    external: true
