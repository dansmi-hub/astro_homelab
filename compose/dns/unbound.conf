# ==============================================================================
# Unbound Recursive DNS Configuration for Pi-hole integration
# ==============================================================================

server:
    # Logging level: 0 = errors only, 1 = operational, 2 = detailed
    verbosity: 1

    interface: 0.0.0.0
    port: 5335
    do-ip4: yes
    do-udp: yes
    do-tcp: yes

    # May be set to yes if IPv6 is available on the host/network
    do-ip6: no
    prefer-ip6: no

    # Use this only when you downloaded the list of primary root servers!
    # If for some reason root.hints cannot be fetched, Unbound falls back to built-in roots.
    root-hints: "/var/lib/unbound/root.hints"

    # Trust anchor file, used for DNSSEC validation
    auto-trust-anchor-file: "/var/lib/unbound/root.key"

    # Respond to queries from local system / private subnets
    access-control: 0.0.0.0/0 refuse
    access-control: 127.0.0.0/8 allow
    access-control: 10.0.0.0/8 allow
    access-control: 172.16.0.0/12 allow
    access-control: 192.168.0.0/16 allow

    # Buffer sizes and performance optimizations
    edns-buffer-size: 1232
    max-udp-size: 1232
    msg-cache-size: 64m
    rrset-cache-size: 128m
    infra-cache-numhosts: 10000

    # Ensure privacy of local IP ranges
    private-address: 10.0.0.0/8
    private-address: 172.16.0.0/12
    private-address: 192.168.0.0/16
    private-address: 169.254.0.0/16

    # Security and Hardening settings
    harden-glue: yes
    harden-dnssec-stripped: yes
    use-caps-for-id: no
    hide-identity: yes
    hide-version: yes

    # Prefetching elements for faster resolution
    prefetch: yes
    prefetch-key: yes

    # Number of threads to use (1 is sufficient for homelabs)
    num-threads: 1

    # Socket receive and send buffer sizes
    so-rcvbuf: 4m
    so-sndbuf: 4m
    so-reuseport: yes
